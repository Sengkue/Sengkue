<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="SengKueVang BLONGMAI - Full-Stack Developer and UI/UX Designer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset=".55" stop-color="#101a3a"/><stop offset="1" stop-color="#1b1146"/>
    </linearGradient>
    <linearGradient id="nameG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#818cf8;#f472b6;#22d3ee" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#818cf8"><animate attributeName="stop-color" values="#818cf8;#f472b6;#22d3ee;#818cf8" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f472b6"><animate attributeName="stop-color" values="#f472b6;#22d3ee;#818cf8;#f472b6" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="o1"><stop offset="0" stop-color="#0891B2" stop-opacity=".55"/><stop offset="1" stop-color="#0891B2" stop-opacity="0"/></radialGradient>
    <radialGradient id="o2"><stop offset="0" stop-color="#6366F1" stop-opacity=".5"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="o3"><stop offset="0" stop-color="#EC4899" stop-opacity=".4"/><stop offset="1" stop-color="#EC4899" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".05"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1000" height="320" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="320" fill="url(#bg)"/>
    <rect width="1000" height="320" fill="url(#grid)"/>

    <!-- drifting light orbs -->
    <circle r="190" fill="url(#o1)"><animate attributeName="cx" values="150;380;150" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="80;220;80" dur="14s" repeatCount="indefinite"/></circle>
    <circle r="210" fill="url(#o2)"><animate attributeName="cx" values="620;420;620" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="260;60;260" dur="17s" repeatCount="indefinite"/></circle>
    <circle r="170" fill="url(#o3)"><animate attributeName="cx" values="880;700;880" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="120;260;120" dur="12s" repeatCount="indefinite"/></circle>

    <!-- floating code symbols -->
    <text x="90" y="60" fill="#22d3ee" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">&lt;/&gt;
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="0.0s" repeatCount="indefinite"/>
    </text>
    <text x="210" y="250" fill="#818cf8" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">{ }
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="70" fill="#f472b6" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">( )=&gt;
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="2.1s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="2.1s" repeatCount="indefinite"/>
    </text>
    <text x="520" y="262" fill="#22d3ee" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">[ ]
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="0.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="0.7s" repeatCount="indefinite"/>
    </text>
    <text x="640" y="52" fill="#818cf8" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">//
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="1.7s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="1.7s" repeatCount="indefinite"/>
    </text>
    <text x="760" y="245" fill="#f472b6" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">&amp;&amp;
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="2.6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="2.6s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="200" fill="#22d3ee" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">0x1F
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="3.0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="3.0s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="40" fill="#818cf8" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">npm
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="3.5s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="3.5s" repeatCount="indefinite"/>
    </text>
    <text x="900" y="200" fill="#f472b6" font-family="'Courier New',Menlo,Consolas,monospace" font-size="22" opacity=".0">git
      <animate attributeName="opacity" values="0;.55;0" dur="6s" begin="1.0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 10;0 -14;0 10" dur="6s" begin="1.0s" repeatCount="indefinite"/>
    </text>

    <!-- spider web (top-right) -->
    <g stroke="#cbd5e1" stroke-opacity=".28" stroke-width="1">
    <line x1="1000" y1="0" x2="979.1" y2="239.1"/>
    <line x1="1000" y1="0" x2="917.9" y2="225.5"/>
    <line x1="1000" y1="0" x2="862.3" y2="196.6"/>
    <line x1="1000" y1="0" x2="816.1" y2="154.3"/>
    <line x1="1000" y1="0" x2="782.5" y2="101.4"/>
    <line x1="1000" y1="0" x2="763.6" y2="41.7"/>
    <polyline points="995.6,49.8 982.9,47.0 971.3,41.0 961.7,32.1 954.7,21.1 950.8,8.7" fill="none"/>
    <polyline points="991.7,94.6 967.5,89.3 945.5,77.8 927.2,61.1 913.9,40.1 906.4,16.5" fill="none"/>
    <polyline points="987.8,139.5 952.1,131.6 919.7,114.7 892.8,90.0 873.1,59.2 862.1,24.3" fill="none"/>
    <polyline points="983.9,184.3 936.7,173.8 893.9,151.5 858.3,118.9 832.3,78.2 817.8,32.1" fill="none"/>
    <polyline points="980.0,229.1 921.3,216.1 868.1,188.4 823.8,147.8 791.5,97.2 773.5,39.9" fill="none"/>
    </g>

    <!-- dangling spider -->
    <line x1="955" y1="0" x2="955" y2="62" stroke="#e2e8f0" stroke-opacity=".6" stroke-width="1.2">
      <animate attributeName="y2" values="62;112;62" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
    </line>
    <g>
      <animateTransform attributeName="transform" type="translate" values="955 62;955 112;955 62" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" keyTimes="0;.5;1"/>
      <g stroke="#ef4444" stroke-width="2" stroke-linecap="round" fill="none">
        <path d="M-6 6 L-17 -2 L-22 8"/><path d="M-7 10 L-19 12 L-22 22"/>
        <path d="M6 6 L17 -2 L22 8"/><path d="M7 10 L19 12 L22 22"/>
      </g>
      <ellipse cx="0" cy="10" rx="8" ry="10" fill="#ef4444"/>
      <circle cx="0" cy="-1" r="6" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
      <circle cx="-2.3" cy="-2" r="1.4" fill="#fff"/><circle cx="2.3" cy="-2" r="1.4" fill="#fff"/>
    </g>

    <!-- NAME -->
    <g filter="url(#glow)">
      <text x="500" y="140" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="1" fill="url(#nameG)">SengKueVang BLONGMAI
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
      </text>
    </g>
    <!-- cycling roles -->
    <text x="500" y="205" text-anchor="middle" fill="#cbd5e1" font-family="'Courier New',Menlo,Consolas,monospace" font-size="24" letter-spacing="2" opacity="0">&lt; Full-Stack Developer /&gt;
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0.000;0.040;0.293;0.333;1.000" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="205" text-anchor="middle" fill="#cbd5e1" font-family="'Courier New',Menlo,Consolas,monospace" font-size="24" letter-spacing="2" opacity="0">&lt; UI / UX Designer /&gt;
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.000;0.333;0.373;0.627;0.667;1.000" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="500" y="205" text-anchor="middle" fill="#cbd5e1" font-family="'Courier New',Menlo,Consolas,monospace" font-size="24" letter-spacing="2" opacity="0">&lt; Always Learning /&gt;
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0.000;0.667;0.707;0.960;1.000" dur="9s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="244" text-anchor="middle" fill="#64748b" font-family="'Courier New',Menlo,Consolas,monospace" font-size="15" letter-spacing="3">VIENTIANE · LAOS</text>

    <!-- animated waves -->
    <path fill="#0891B2" fill-opacity=".22" d="M0 292 q125 -34 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V330 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="#6366F1" fill-opacity=".25" d="M0 300 q125 30 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V330 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="-500 0" to="0 0" dur="12s" repeatCount="indefinite"/>
    </path>
    <path fill="#EC4899" fill-opacity=".28" d="M0 310 q125 -22 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V330 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-500 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>
  <rect x=".5" y=".5" width="999" height="319" rx="22" fill="none" stroke="#fff" stroke-opacity=".08"/>
</svg>
