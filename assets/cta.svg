<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 110" width="600" height="110" role="img" aria-label="Let's build something together - email me" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#0891B2"/><stop offset=".33" stop-color="#6366F1"/><stop offset=".66" stop-color="#EC4899"/><stop offset="1" stop-color="#0891B2"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="300 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="cp"><rect x="12" y="12" width="576" height="86" rx="43"/></clipPath>
    <filter id="gl" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect x="12" y="12" width="576" height="86" rx="43" fill="url(#bd)" filter="url(#gl)" opacity=".55"><animate attributeName="opacity" values=".35;.7;.35" dur="2.4s" repeatCount="indefinite"/></rect>
  <rect x="12" y="12" width="576" height="86" rx="43" fill="#0b1220" stroke="url(#bd)" stroke-width="3"/>
  <g clip-path="url(#cp)"><rect y="0" width="120" height="110" fill="url(#sh)" transform="skewX(-20)"><animate attributeName="x" values="-200;700" dur="3.4s" repeatCount="indefinite"/></rect></g>
  <text x="300" y="52" text-anchor="middle" fill="#f8fafc" font-family="'Segoe UI',Helvetica,Arial,'Leelawadee UI','Noto Sans Lao',sans-serif" font-size="25" font-weight="800" letter-spacing=".5">Let's build something together  →</text>
  <text x="300" y="77" text-anchor="middle" fill="#22d3ee" font-family="'Courier New',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" letter-spacing="1">skvgithub@gmail.com</text>
</svg>
